name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: backend/build/reports/tests
