name: quiz-room
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quiz-local}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quiz -d quiz"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    init: true
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-quiz-local}
      REDIS_HOST: redis
      DEMO_ENABLED: "true"
      DEMO_USERNAME: ${DEMO_USERNAME:-host@example.test}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-local-quiz-only}
    volumes: [./backend:/app, gradle-cache:/root/.gradle]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 60
  frontend:
    build: ./frontend
    init: true
    volumes: [./frontend:/app, frontend-modules:/app/node_modules]
    ports: ["127.0.0.1:4200:4200"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  gradle-cache:
  frontend-modules:
