name: quiz-room-check
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: quiz_test, POSTGRES_USER: quiz, POSTGRES_PASSWORD: quiz-test}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quiz -d quiz_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  backend-test:
    build: ./backend
    init: true
    environment: {DB_HOST: postgres, DB_NAME: quiz_test, DB_PASSWORD: quiz-test, REDIS_HOST: redis, TEST_ENV: "1", DEMO_ENABLED: "true"}
    # Gradle distribution and dependency caches live in ./.cache/gradle so CI can restore them between runs.
    volumes: [./backend:/app, ./.cache/gradle:/root/.gradle]
    command: [clean, test, integrationTest, bootJar, --no-daemon]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend-test:
    build: ./frontend
    init: true
    # node_modules stays in a named volume for speed; the npm download cache is bind-mounted for CI restore.
    volumes: [./frontend:/app, frontend-modules:/app/node_modules, ./.cache/npm:/root/.npm, ./:/repo:ro]
    command: [sh, -c, "node /repo/scripts/check-docs.mjs && node --test /repo/scripts/check-docs.test.mjs && npm test && npm run build"]
  lua-smoke:
    build: {context: ./scripts, dockerfile: lua.Dockerfile}
    volumes: [./:/repo:ro]
    working_dir: /repo
    command: [lua5.4, scripts/test-room.lua, .]
volumes:
  frontend-modules:
